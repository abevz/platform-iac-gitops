apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestdemo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-lab
  source:
    repoURL: https://gitlab.bevz.net/abevz/platform-iac-gitops.git
    path: k8s-lab-01/guestbook
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: guestdemo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
