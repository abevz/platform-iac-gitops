apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vector-reranker
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-lab
  source:
    repoURL: https://gitlab.example.com/abevz/platform-iac-gitops.git
    targetRevision: main
    path: lab-cluster/vector-reranker
    directory:
      exclude: README.md
  destination:
    server: https://kubernetes.default.svc
    namespace: vector
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
